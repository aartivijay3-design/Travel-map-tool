<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luxury Route Map Generator</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    /* ── Reset ──────────────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold:       #A07820;
      --gold-light: #C8A02A;
      --gold-pale:  #f5eed8;
      --teal:       #6EAAA8;
      --teal-dark:  #4F8888;
      --white:      #FFFFFF;
      --offwhite:   #FAF8F4;
      --text:       #2C2C2C;
      --muted:      #6B6B6B;
      --border:     #DDD5C0;
    }

    html, body { height: 100%; font-family: 'Montserrat', sans-serif;
                 font-weight: 300; font-size: 14px; background: var(--offwhite); }

    /* ── Shell ──────────────────────────────────────────────────────────────── */
    .shell {
      display: grid;
      grid-template-rows: 58px 1fr 36px;
      grid-template-columns: 340px 1fr;
      height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────────────────── */
    header {
      grid-column: 1 / -1;
      background: var(--white);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 16px;
      padding: 0 32px;
    }
    header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px; font-weight: 600; letter-spacing: 0.04em;
    }
    header .sep { width: 28px; height: 1px; background: var(--gold-light); }
    header .sub { font-size: 10px; letter-spacing: 0.2em;
                  text-transform: uppercase; color: var(--gold); }

    /* ── Sidebar ────────────────────────────────────────────────────────────── */
    .sidebar {
      background: var(--white);
      border-right: 1px solid var(--border);
      padding: 28px 26px 32px;
      display: flex; flex-direction: column; gap: 22px;
      overflow-y: auto;
    }

    .field { display: flex; flex-direction: column; gap: 7px; }

    label {
      font-size: 10px; letter-spacing: 0.2em;
      text-transform: uppercase; color: var(--gold); font-weight: 500;
    }
    label .hint {
      display: block; margin-top: 3px;
      font-size: 11px; letter-spacing: 0.05em; text-transform: none;
      color: var(--muted); font-weight: 300;
    }

    textarea, input[type="text"] {
      width: 100%; border: 1px solid var(--border); border-radius: 3px;
      background: var(--offwhite); padding: 9px 12px;
      font-family: 'Montserrat', sans-serif; font-size: 13px;
      font-weight: 300; color: var(--text); outline: none;
      transition: border-color .2s, box-shadow .2s; resize: vertical;
    }
    textarea:focus, input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(110,170,168,.15);
    }
    textarea { min-height: 140px; line-height: 1.75; }

    /* chips */
    .chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .chip {
      font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--teal-dark); border: 1px solid var(--teal);
      border-radius: 2px; padding: 3px 8px; cursor: pointer;
      background: transparent; font-family: inherit; font-weight: 400;
      transition: background .15s, color .15s;
    }
    .chip:hover { background: var(--teal); color: var(--white); }

    /* buttons */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; padding: 13px; border: none; border-radius: 3px;
      font-family: 'Montserrat', sans-serif; font-size: 11px; font-weight: 500;
      letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer;
      transition: background .2s, opacity .15s;
    }
    .btn-primary { background: var(--gold); color: var(--white); }
    .btn-primary:hover { background: #8a6515; }
    .btn-secondary {
      background: transparent; color: var(--teal-dark);
      border: 1px solid var(--teal);
    }
    .btn-secondary:hover { background: rgba(110,170,168,.08); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    .btn-row { display: flex; flex-direction: column; gap: 9px; }

    /* messages */
    .msg {
      display: none; font-size: 12px; border-radius: 3px;
      padding: 9px 12px; line-height: 1.5;
    }
    .msg.error   { display: block; color: #b44; background: #fff0f0; border: 1px solid #f0c0c0; }
    .msg.info    { display: block; color: #555; background: #f0f4f5; border: 1px solid #cde; }

    /* download panel (appears below map after preview) */
    .dl-bar {
      display: none;
      align-items: center; justify-content: space-between;
      padding: 10px 16px;
      background: var(--white); border-top: 1px solid var(--border);
      gap: 14px;
    }
    .dl-bar.visible { display: flex; }
    .dl-hint { font-size: 11px; color: var(--muted); }
    .dl-hint strong { color: var(--gold); font-weight: 500; }
    .dl-btn {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 20px; border: 1px solid var(--gold);
      border-radius: 3px; background: transparent; color: var(--gold);
      font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      cursor: pointer; transition: background .2s;
      white-space: nowrap;
    }
    .dl-btn:hover { background: var(--gold-pale); }
    .dl-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* spinner */
    .spinner-wrap {
      display: none; position: absolute; inset: 0;
      align-items: center; justify-content: center;
      background: rgba(255,255,255,.6); z-index: 1000; gap: 12px;
    }
    .spinner-wrap.visible { display: flex; flex-direction: column; }
    .spinner {
      width: 34px; height: 34px;
      border: 2.5px solid var(--border); border-top-color: var(--gold);
      border-radius: 50%; animation: spin .85s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin-label {
      font-family: 'Cormorant Garamond', serif; font-size: 16px;
      font-style: italic; color: var(--teal-dark);
    }

    /* ── Map area ────────────────────────────────────────────────────────────── */
    .map-col {
      position: relative;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    #leaflet-map {
      flex: 1;
      width: 100%;
      min-height: 0;
    }

    /* ── Footer ─────────────────────────────────────────────────────────────── */
    footer {
      grid-column: 1 / -1;
      text-align: center; font-size: 10px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--border); padding: 10px;
      border-top: 1px solid var(--border); background: var(--white);
    }

    /* ── Leaflet overrides ───────────────────────────────────────────────────── */
    /* Custom pin icon */
    .lf-pin-wrap { position: relative; width: 28px; height: 40px; }
    .lf-pin-wrap svg { position: absolute; top: 0; left: 0; filter: drop-shadow(0 2px 3px rgba(0,0,0,.25)); }

    /* Permanent tooltip / city label */
    .leaflet-tooltip.city-lbl {
      background: transparent; border: none; box-shadow: none;
      padding: 0; font-family: 'Montserrat', sans-serif;
      font-size: 12px; font-weight: 600;
      color: #CC8B1A;
      white-space: nowrap;
      text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff,
                   -1px  1px 0 #fff, 1px  1px 0 #fff;
    }
    .leaflet-tooltip.city-lbl::before { display: none; }

    /* ── Responsive ──────────────────────────────────────────────────────────── */
    @media (max-width: 700px) {
      .shell { grid-template-columns: 1fr; grid-template-rows: 58px auto 1fr auto 36px; }
      .sidebar { max-height: 48vh; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>

<div class="shell">

  <!-- Header -->
  <header>
    <h1>Route Map Generator</h1>
    <span class="sep"></span>
    <span class="sub">Luxury Itineraries</span>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">

    <div class="field">
      <label>Destination Cities
        <span class="hint">One city per line, in travel order</span>
      </label>
      <textarea id="citiesInput" spellcheck="false"
        placeholder="Beijing&#10;Xi'an&#10;Guilin&#10;Shanghai"></textarea>
    </div>

    <div class="field">
      <label>Country or Region
        <span class="hint">e.g. China · Japan · Southeast Asia</span>
      </label>
      <input type="text" id="countryInput" placeholder="China" autocomplete="off" />
      <div class="chips" id="regionChips"></div>
    </div>

    <div id="msgBox" class="msg"></div>

    <div class="btn-row">
      <button class="btn btn-primary" id="previewBtn" onclick="previewRoute()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
        Preview Route on Map
      </button>

      <button class="btn btn-secondary" id="clearBtn" onclick="clearRoute()" style="display:none">
        Clear Route
      </button>
    </div>

  </aside>

  <!-- Map column -->
  <div class="map-col">

    <!-- Leaflet map -->
    <div id="leaflet-map"></div>

    <!-- Loading spinner overlay -->
    <div class="spinner-wrap" id="spinnerWrap">
      <div class="spinner"></div>
      <span class="spin-label" id="spinLabel">Loading…</span>
    </div>

    <!-- Download bar (shown after preview) -->
    <div class="dl-bar" id="dlBar">
      <span class="dl-hint">
        Zoom &amp; pan to your desired framing, then
        <strong>download a high-resolution styled map</strong> at that exact view.
      </span>
      <button class="dl-btn" id="dlBtn" onclick="downloadMap()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Download JPEG
      </button>
    </div>

  </div><!-- /map-col -->

  <footer>Natural Earth · Flask · GeoPandas · Leaflet · Carto</footer>

</div><!-- /shell -->

<script>
// ── Leaflet map setup ─────────────────────────────────────────────────────────
const map = L.map('leaflet-map', { zoomControl: true }).setView([25, 80], 4);

L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  { attribution: '&copy; <a href="https://osm.org">OpenStreetMap</a> &copy; <a href="https://carto.com">CARTO</a>',
    subdomains: 'abcd', maxZoom: 19 }
).addTo(map);

// State tracking
let routeLayer  = null;
let currentCities  = [];
let currentCountry = '';

// ── Region chips ──────────────────────────────────────────────────────────────
const CHIPS = ['China','Japan','Southeast Asia','Western Europe','Italy',
               'Morocco','India','East Africa','Greece','Turkey','France',
               'Spain','Scandinavia','Peru'];

const chipsEl = document.getElementById('regionChips');
CHIPS.forEach(r => {
  const b = document.createElement('button');
  b.className = 'chip'; b.textContent = r;
  b.onclick = () => document.getElementById('countryInput').value = r;
  chipsEl.appendChild(b);
});

document.getElementById('countryInput')
  .addEventListener('keydown', e => { if (e.key === 'Enter') previewRoute(); });

// ── Custom SVG pin factory ────────────────────────────────────────────────────
function makePinIcon(color = '#6EAAA8', outline = '#FFFFFF') {
  const svg = `
    <svg width="28" height="40" viewBox="0 0 28 40" xmlns="http://www.w3.org/2000/svg">
      <path d="M14 0C6.27 0 0 6.27 0 14C0 24.5 14 40 14 40C14 40 28 24.5 28 14C28 6.27 21.73 0 14 0Z"
            fill="${color}" stroke="${outline}" stroke-width="2"/>
      <circle cx="14" cy="14" r="5" fill="${outline}"/>
    </svg>`;
  return L.divIcon({
    html: `<div class="lf-pin-wrap">${svg}</div>`,
    className: '', iconSize: [28, 40], iconAnchor: [14, 40]
  });
}

// ── Bezier arc sampler (geographic approx.) ───────────────────────────────────
function bezierArc(p1, p2, numPts = 70, curvature = 0.18) {
  // p1/p2 = [lat, lng]
  const mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;
  const dlat = p2[0] - p1[0],     dlng = p2[1] - p1[1];
  // perpendicular offset (CCW)
  const ctrl = [mx - dlng * curvature, my + dlat * curvature];
  const pts  = [];
  for (let i = 0; i <= numPts; i++) {
    const t = i / numPts;
    pts.push([
      (1-t)**2 * p1[0] + 2*(1-t)*t * ctrl[0] + t**2 * p2[0],
      (1-t)**2 * p1[1] + 2*(1-t)*t * ctrl[1] + t**2 * p2[1],
    ]);
  }
  return pts;
}

// ── Preview route ─────────────────────────────────────────────────────────────
async function previewRoute() {
  const rawCities = document.getElementById('citiesInput').value;
  const country   = document.getElementById('countryInput').value.trim();
  clearMsg();

  const cities = rawCities.split('\n').map(s => s.trim()).filter(Boolean);
  if (!cities.length) { showMsg('Please enter at least one city.', 'error'); return; }
  if (!country)       { showMsg('Please enter a country or region.', 'error'); return; }

  currentCities  = cities;
  currentCountry = country;

  setSpinner(true, 'Plotting route…');
  setBtn(true);

  try {
    const res = await fetch('/api/geocode', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ cities }),
    });
    const geocoded = await res.json();

    if (!geocoded.length) {
      showMsg('No cities could be located. Check spelling.', 'error');
      return;
    }

    const notFound = cities.filter(
      c => !geocoded.find(g => g.name.toLowerCase() === c.toLowerCase())
    );
    if (notFound.length)
      showMsg(`Not in database (will be skipped): ${notFound.join(', ')}`, 'info');

    // Remove previous layer
    if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
    routeLayer = L.layerGroup().addTo(map);

    const pin    = makePinIcon('#6EAAA8', '#FFFFFF');
    const bounds = [];

    // Draw arced route segments
    for (let i = 0; i < geocoded.length - 1; i++) {
      const p1  = [geocoded[i].lat,     geocoded[i].lon];
      const p2  = [geocoded[i+1].lat,   geocoded[i+1].lon];
      const arc = bezierArc(p1, p2);
      L.polyline(arc, {
        color: '#6EAAA8', weight: 2.8, opacity: 0.9,
        dashArray: '9 6', lineCap: 'round'
      }).addTo(routeLayer);
    }

    // Draw pins + permanent labels
    geocoded.forEach(city => {
      bounds.push([city.lat, city.lon]);
      L.marker([city.lat, city.lon], { icon: pin })
        .bindTooltip(city.name, {
          permanent: true, direction: 'right',
          className: 'city-lbl', offset: [6, -20]
        })
        .addTo(routeLayer);
    });

    // Fit map to route + padding
    if (bounds.length === 1) {
      map.setView(bounds[0], 7);
    } else {
      map.fitBounds(bounds, { padding: [60, 60] });
    }

    // Show download bar + clear button
    document.getElementById('dlBar').classList.add('visible');
    document.getElementById('clearBtn').style.display = '';

  } catch (err) {
    showMsg('Preview failed: ' + err.message, 'error');
  } finally {
    setSpinner(false);
    setBtn(false);
  }
}

// ── Clear route ───────────────────────────────────────────────────────────────
function clearRoute() {
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
  document.getElementById('dlBar').classList.remove('visible');
  document.getElementById('clearBtn').style.display = 'none';
  clearMsg();
}

// ── Download styled map at current Leaflet viewport ───────────────────────────
async function downloadMap() {
  if (!currentCities.length || !currentCountry) {
    showMsg('Preview a route first.', 'error'); return;
  }

  const leafBounds = map.getBounds();
  const bounds = {
    north: leafBounds.getNorth(),
    south: leafBounds.getSouth(),
    east:  leafBounds.getEast(),
    west:  leafBounds.getWest(),
  };

  const dlBtn = document.getElementById('dlBtn');
  dlBtn.disabled = true;
  setSpinner(true, 'Rendering your map…');

  try {
    const res = await fetch('/api/generate', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        cities:  currentCities,
        country: currentCountry,
        bounds,
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
      throw new Error(err.error || `HTTP ${res.status}`);
    }

    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = `${currentCountry.toLowerCase().replace(/\s+/g, '-')}-route.jpg`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);

  } catch (err) {
    showMsg('Download failed: ' + err.message, 'error');
  } finally {
    dlBtn.disabled = false;
    setSpinner(false);
  }
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function showMsg(text, type = 'info') {
  const el = document.getElementById('msgBox');
  el.textContent = text;
  el.className   = `msg ${type}`;
}
function clearMsg() {
  const el = document.getElementById('msgBox');
  el.className = 'msg'; el.textContent = '';
}
function setSpinner(on, label = '') {
  const w = document.getElementById('spinnerWrap');
  w.classList.toggle('visible', on);
  if (label) document.getElementById('spinLabel').textContent = label;
}
function setBtn(on) {
  document.getElementById('previewBtn').disabled = on;
}
</script>
</body>
</html>
